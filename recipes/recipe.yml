---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1

# Name of your custom image (published to ghcr.io/<user>/<name>)
name: my-custom-bluebuild-image

# Description of the image
description: Custom Fedora Silverblue image built with BlueBuild

# Base OCI image to build on top of
base-image: ghcr.io/ublue-os/silverblue-main

# Image version tag
image-version: stable

# List of BlueBuild modules to run
modules:
  - type: files
    files:
      - source: system/
        destination: /

  - type: dnf
    repos:
      cleanup: true
      files:
        - https://githubusercontent.com
      keys:
        - https://fyralabs.com
    copr:
      enable:
        - scottames/ghostty
      disable:
        - phracek/PyCharm
    install:
      skip-unavailable: true
      packages:
        - repo: terra
          packages:
            - mangowm
            - noctalia-nightly
        - brightnessctl
        - distrobox
        - fastfetch
        - fish
        - fzf
        - libappindicator-gtk3
        - tailscale
        - wlr-randr
        - xdg-desktop-portal-wlr
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - scope: user
        repo:
          title: Flathub (user)
      - notify: true
        install:
          - app.zen_browser.zen # dnf
          - com.discordapp.Discord
          - com.github.iwalton3.jellyfin-media-player
          - com.github.tchx84.Flatseal
          - com.github.zocker_160.SyncThingy # dnf?
          - com.heroicgameslauncher.hgl
          - com.protonvpn.www
          - io.freetubeapp.FreeTube
          - io.github.martchus.syncthingtray # dnf?
          - io.github.peazip.PeaZip
          - io.github.sinelaw.fresh # keep?
          - io.mpv.Mpv
          - md.obsidian.Obsidian
          - org.cataclysmdda.CataclysmDDA
          - org.gnome.Calculator
          - org.gnome.Loupe
          - org.gnome.seahorse.Application
          - org.jellyfin.JellyfinDesktop # this and jellyfin-media-player?
          - org.pulseaudio.pavucontrol
          - org.qbittorrent.qBittorrent

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
