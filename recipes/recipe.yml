---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: spooky-blue-build
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system/
        destination: /

  - type: dnf
    repos:
      cleanup: true
      files:
        - https://repo.protonvpn.com/fedora-$releasever-stable
        - https://repos.fyralabs.com/terra$releasever
      enable:
        - protonvpn-stable
        - terra
      copr:
        enable:
          - scottames/ghostty
        disable:
          - phracek/PyCharm
    install:
      skip-unavailable: true
      packages:
        - repo: protonvpn-stable
          packages:
            - protonvpn-app # correct package name???
        - repo: terra
          packages:
            - mangowm
            - noctalia-nightly
        - brightnessctl
        - distrobox
        - fastfetch
        - fish
        - fzf
        - libappindicator-gtk3
        - tailscale
        - wlr-randr
        - xdg-desktop-portal-wlr
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - scope: user
        repo:
          title: Flathub (user)
      - notify: true
        install:
          - app.zen_browser.zen # dnf
          - com.discordapp.Discord
          - com.github.iwalton3.jellyfin-media-player
          - com.github.tchx84.Flatseal
          - com.github.zocker_160.SyncThingy # dnf?
          - com.heroicgameslauncher.hgl
          - io.freetubeapp.FreeTube
          - io.github.martchus.syncthingtray # dnf?
          - io.github.peazip.PeaZip
          - io.github.sinelaw.fresh # keep?
          - io.mpv.Mpv
          - md.obsidian.Obsidian
          - org.cataclysmdda.CataclysmDDA
          - org.gnome.Calculator
          - org.gnome.Loupe
          - org.gnome.seahorse.Application
          - org.jellyfin.JellyfinDesktop # this and jellyfin-media-player?
          - org.pulseaudio.pavucontrol
          - org.qbittorrent.qBittorrent

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
